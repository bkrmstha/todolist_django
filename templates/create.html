{% extends 'base.html'%}

{% block title %}Create Task{% endblock title %}
{% block body %}
<div class="container">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" name="title" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Desciption</label>
          <textarea class="form-control" name="description" id="exampleFormControlTextarea1" required></textarea>
        </div>
        <button type="submit" class="btn-solid theme-primary">Submit</button>
    </form>
</div>
{% endblock body %}
