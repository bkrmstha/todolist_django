{% extends "base.html" %}

{% block title %}{{title}}{% endblock title %}
    

{% block body %}
  <h1>{{heading}}</h1>
  <p>{{content}}</p>

  <table class="table">
    <thead>
      <tr>
        <th scope="col">S.N.</th>
        <th scope="col">Name</th>
        <th scope="col">Age</th>
        <th scope="col">Address</th>
      </tr>
    </thead>
    <tbody>
    {% for person in people %}
      <tr>
        <th scope="row">1</th>
        <td>{{person.name}}</td>
        <td>{{person.age}}</td>
        <td>{{person.address}}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock body %}
